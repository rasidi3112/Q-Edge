[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "q-edge"
dynamic = ["version"]
description = "Testbed for federated learning with hybrid quantum-classical models and post-quantum secure aggregation"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Ahmad Rasidi" }]
keywords = [
    "federated-learning",
    "quantum-machine-learning",
    "post-quantum-cryptography",
    "variational-quantum-circuits",
    "pennylane",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Physics",
    "Typing :: Typed",
]
requires-python = ">=3.11"
# Lower bounds are the oldest versions the CI matrix resolves and tests.
dependencies = [
    "cryptography>=46",
    "numpy>=2.4",
    "pennylane>=0.45",
    "scipy>=1.17",
]

[project.optional-dependencies]
server = [
    "celery[redis]>=5.6",
    "fastapi>=0.138",
    "pydantic>=2.14",
    "python-jose[cryptography]>=3.5",
    "starlette>=1.3",
    "uvicorn>=0.49",
]
fl = [
    "flwr>=1.32",
    "torch>=2.14",
]
pqc = [
    "liboqs-python>=0.16",
]
# Pure-Python ML-KEM/ML-DSA for tests and CI. Empty until qedge.crypto.backends.pure exists.
pqc-pure = []
dev = [
    "httpx>=0.28",
    "mypy>=1.19",
    "pre-commit>=4",
    "pytest>=9",
    "pytest-asyncio>=1.4",
    "pytest-cov>=7",
    # Pinned to the version in .pre-commit-config.yaml so both format identically.
    "ruff==0.17.1",
]

[project.urls]
Repository = "https://github.com/rasidi3112/Q-Edge"
Issues = "https://github.com/rasidi3112/Q-Edge/issues"

[project.scripts]
qedge-api = "qedge.server.app:run_server"

[tool.hatch.version]
path = "src/qedge/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/qedge"]

[tool.hatch.build.targets.sdist]
include = ["src/qedge", "tests", "README.md", "LICENSE"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "PTH",  # flake8-use-pathlib
    "D",    # pydocstyle
    "RUF",  # Ruff-specific rules
]
# B008: FastAPI's Depends() in argument defaults is the framework idiom.
# D105/D107: magic methods and __init__ are documented on the class.
ignore = ["B008", "D105", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["qedge"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
# demo.py predates these rules and prints emoji; it is replaced by a CLI demo later.
"demo.py" = ["D", "RUF001"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "pennylane.*",
    "celery.*",
    "flwr.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning"
]
addopts = "-v --tb=short --cov=qedge --cov-report=term-missing --cov-report=xml"

[tool.coverage.run]
branch = true
source = ["qedge"]
omit = ["*/tests/*", "*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:"
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "q-edge"
dynamic = ["version"]
description = "Testbed for federated learning with hybrid quantum-classical models and post-quantum secure aggregation"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Ahmad Rasidi" }]
keywords = [
    "federated-learning",
    "quantum-machine-learning",
    "post-quantum-cryptography",
    "variational-quantum-circuits",
    "pennylane",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Physics",
    "Typing :: Typed",
]
requires-python = ">=3.11"
# Lower bounds are the oldest versions the CI matrix resolves and tests.
dependencies = [
    "cryptography>=46",
    "numpy>=2.4",
    "pennylane>=0.45",
    "scipy>=1.17",
]

[project.optional-dependencies]
server = [
    "alembic>=1.20",
    "celery[redis]>=5.6",
    "fastapi>=0.138",
    "prometheus-client>=0.26",
    "pydantic>=2.14",
    "pydantic-settings>=2.16",
    "pyjwt>=2.15",
    "sqlalchemy>=2.1",
    "starlette>=1.3",
    "uvicorn>=0.49",
]
# Postgres driver for the docker-compose stack; CI tests run on SQLite only.
postgres = [
    "psycopg[binary]>=3.2",
]
# scikit-learn provides the datasets, PyYAML writes run configs.
fl = [
    "flwr>=1.40",
    "pyyaml>=6",
    "scikit-learn>=1.9",
    "torch>=2.14",
]
# Figures for docs/results.md (experiments/report.py).
report = [
    "matplotlib>=3.10",
]
# Ray backend for `flwr run`; the in-process simulator does not need it.
flower-sim = [
    "flwr[simulation]>=1.40",
]
pqc = [
    "liboqs-python>=0.16",
]
# Pure-Python ML-KEM/ML-DSA: not constant-time, for tests and CI only.
pqc-pure = [
    "dilithium-py>=1.5",
    "kyber-py>=1.2",
]
dev = [
    "httpx>=0.28",
    "hypothesis>=6.170",
    "mypy>=1.19",
    "pre-commit>=4",
    "pytest>=9",
    "pytest-asyncio>=1.4",
    "pytest-cov>=7",
    # Pinned to the version in .pre-commit-config.yaml so both format identically.
    "ruff==0.17.1",
    "types-pyyaml>=6",
]

[project.urls]
Repository = "https://github.com/rasidi3112/Q-Edge"
Issues = "https://github.com/rasidi3112/Q-Edge/issues"

[project.scripts]
qedge = "qedge.cli:main"
qedge-api = "qedge.server.app:run_server"

[tool.hatch.version]
path = "src/qedge/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/qedge"]

[tool.hatch.build.targets.sdist]
include = ["src/qedge", "tests", "README.md", "LICENSE"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "PTH",  # flake8-use-pathlib
    "D",    # pydocstyle
    "RUF",  # Ruff-specific rules
]
# B008: FastAPI's Depends() in argument defaults is the framework idiom.
# D105/D107: magic methods and __init__ are documented on the class.
ignore = ["B008", "D105", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["experiments", "qedge"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
# demo.py predates these rules and prints emoji; it is replaced by a CLI demo later.
"demo.py" = ["D", "RUF001"]
# The report writes Greek letters (alpha, beta) into Markdown tables on purpose.
"experiments/report.py" = ["RUF001"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# No type information: celery, liboqs, PennyLane, scikit-learn and scipy
# ship neither stubs nor py.typed.
module = ["celery.*", "oqs.*", "pennylane.*", "scipy.*", "sklearn.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# qml.qnode and Celery's task decorator are untyped, and the worker
# subclasses celery.Task, which is Any here.
module = ["qedge.quantum.*", "qedge.server.worker"]
disallow_untyped_decorators = false
disallow_subclassing_any = false

[tool.pytest.ini_options]
testpaths = ["tests"]
# The experiments package lives at the repository root.
pythonpath = ["."]
addopts = "-ra --strict-markers --strict-config"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "slow: takes more than a few seconds; CI runs these in a separate scheduled job",
]

[tool.coverage.run]
branch = true
source = ["qedge"]
omit = ["*/tests/*", "*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:"
]

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      # CPU wheels: the default torch wheel pulls in CUDA libraries.
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e ".[dev,server,fl]"
      - run: ruff check . --output-format=github
      - run: ruff format --check .
      - run: mypy src/qedge

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e ".[dev,server,pqc-pure,fl,report]"
      - run: pytest -m "not slow" --cov=qedge --cov-report=term-missing
      - run: qedge simulate --clients 10 --rounds 30 --out "$RUNNER_TEMP/runs"

  test-liboqs:
    name: Tests with liboqs ${{ matrix.liboqs }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        liboqs: ["0.16.0"]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - id: cache-liboqs
        uses: actions/cache@v6.1.0
        with:
          path: ~/_oqs
          key: liboqs-${{ matrix.liboqs }}-${{ runner.os }}-${{ runner.arch }}
      - name: Build liboqs into ~/_oqs
        if: steps.cache-liboqs.outputs.cache-hit != 'true'
        env:
          LIBOQS_VERSION: ${{ matrix.liboqs }}
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends ninja-build
          git clone --depth 1 --branch "$LIBOQS_VERSION" https://github.com/open-quantum-safe/liboqs "$RUNNER_TEMP/liboqs"
          cmake -S "$RUNNER_TEMP/liboqs" -B "$RUNNER_TEMP/liboqs/build" -GNinja \
            -DBUILD_SHARED_LIBS=ON -DOQS_BUILD_ONLY_LIB=ON -DOQS_DIST_BUILD=ON -DOQS_USE_OPENSSL=OFF \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$HOME/_oqs" -DCMAKE_INSTALL_LIBDIR=lib
          cmake --build "$RUNNER_TEMP/liboqs/build" --parallel
          cmake --build "$RUNNER_TEMP/liboqs/build" --target install
      - run: pip install -e ".[dev,server,pqc,pqc-pure]"
      # Fails instead of letting every liboqs test skip if the backend is missing.
      - run: python -c "from qedge.crypto.backends import available_backends as a; assert 'liboqs' in a(), a()"
      - run: pytest -m "not slow"

  docker:
    name: Docker build (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [api, worker]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/build-push-action@v7.4.0
        with:
          context: .
          target: ${{ matrix.target }}
          push: false
          tags: qedge-${{ matrix.target }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

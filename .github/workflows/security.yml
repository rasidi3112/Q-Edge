name: Security scanning

on:
  schedule:
    - cron: "0 0 * * *"  # Daily at midnight UTC
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  security-events: write

jobs:
  secret-scan:
    name: Secret detection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: trufflesecurity/trufflehog@v3.99.2
        with:
          extra_args: --only-verified
      - uses: gitleaks/gitleaks-action@v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"
      - run: pip install -e ".[server]"
      - run: pip freeze --exclude-editable > requirements-audit.txt
      # Ignored advisories have no fixed release and are not reachable from this code:
      #   PYSEC-2026-4298 (python-jose): HS256 forgery only when `algorithms` is not
      #     restricted; verify_jwt_token passes a single algorithm.
      #   PYSEC-2026-1325 (ecdsa, via python-jose): timing leak in ECDSA signing; no
      #     ECDSA keys are used.
      # Remove both when python-jose is replaced.
      - run: >-
          pipx run pip-audit==2.10.1 --strict --no-deps --disable-pip
          -r requirements-audit.txt
          --ignore-vuln PYSEC-2026-4298
          --ignore-vuln PYSEC-2026-1325

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: github/codeql-action/init@v4.39.0
        with:
          languages: python
          queries: security-and-quality
      - uses: github/codeql-action/analyze@v4.39.0
        with:
          category: "/language:python"

  bandit:
    name: Bandit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"
      - run: pip install "bandit[sarif,toml]"
      # Findings are reported to code scanning instead of failing the job;
      # --exit-zero still lets a crash of bandit itself fail it.
      - run: bandit -r src/qedge --exit-zero -f sarif -o bandit-results.sarif
      - uses: github/codeql-action/upload-sarif@v4.39.0
        if: always()
        with:
          sarif_file: bandit-results.sarif

  container-scan:
    name: Container scan
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v7.0.1
      - run: docker build --target api -t qedge-api:scan .
      # Results go to code scanning; trivy's default exit code is 0.
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: qedge-api:scan
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
      - uses: github/codeql-action/upload-sarif@v4.39.0
        if: always()
        with:
          sarif_file: trivy-results.sarif

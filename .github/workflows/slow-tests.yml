name: Slow tests

on:
  schedule:
    - cron: "0 3 * * 1"  # Mondays 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  slow:
    name: Tests marked slow
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      # pip's resolver gives up on the fl extra (resolution-too-deep): flwr caps
      # fastapi, starlette, uvicorn, typer and protobuf below their latest
      # releases. uv resolves it and keeps the CPU torch installed above.
      - run: pip install uv==0.13.7
      - run: uv pip install --system -e ".[dev,server,pqc-pure,fl,flower-sim,report]"
      - run: pytest -m slow

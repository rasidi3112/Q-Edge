# Local stack: API, Celery worker, and Redis as broker and result backend.
# JWT_SECRET_KEY and REDIS_PASSWORD must be set (see .env.example). The API
# refuses to start until server keys exist in the server_keys volume:
#   docker compose run --rm api qedge keys init --dir /keys
#   docker compose up --build

x-celery-env: &celery-env
  CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set}@redis:6379/0
  CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set}@redis:6379/1

services:
  api:
    build:
      context: .
      target: api
    environment:
      <<: *celery-env
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set}
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    volumes:
      - server_keys:/keys
    depends_on:
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      target: worker
    environment:
      <<: *celery-env
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD must be set}", "--appendonly", "yes"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - redis_data:/data

volumes:
  redis_data:
  server_keys:
